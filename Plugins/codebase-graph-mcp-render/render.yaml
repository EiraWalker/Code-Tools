# Public source; configure all project-specific values privately in Render.
services:
  - type: web
    name: codebase-graph-engine
    runtime: python
    rootDir: Plugins/codebase-graph-mcp-render
    plan: free
    region: oregon
    buildCommand: bash backend/build-render.sh
    startCommand: python backend/server.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: CBM_BINARY
        value: backend/.cbm-upstream/build/c/codebase-memory-mcp
      - key: CBM_CACHE_DIR
        value: .runtime/cache
      - key: CBM_BIND_HOST
        value: 0.0.0.0
      - key: CBM_SERVICE_TOKEN
        sync: false
      - key: CBM_PROJECT
        sync: false
      - key: CBM_SOURCE_REPOSITORY
        sync: false
      - key: CBM_GRAPH_PATH
        sync: false
      - key: CBM_GRAPH_SHA256
        sync: false
      - key: CBM_GRAPH_BLOB_SHA
        sync: false
      - key: CBM_GRAPH_URL
        sync: false
      - key: CBM_GRAPH_BEARER_TOKEN
        sync: false
      # Optional: the existing index-generating workflow's OIDC identity.
      - key: CBM_SYNC_REPOSITORY
        sync: false
      - key: CBM_SYNC_REPOSITORY_ID
        sync: false
      - key: CBM_SYNC_REF
        value: refs/heads/main
      - key: CBM_SYNC_WORKFLOW
        value: .github/workflows/code-index.yml
